[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/test_report.html --self-contained-html --tb=short
markers =
    smoke: High priority core smoke tests for critical search paths
    regression: Full regression test suite covering all search behaviors
    filter_sort: Tests validating sorting and filtering operations
    pagination: Tests validating multi-page navigation
    edge_case: Tests covering zero results, boundary, and special character inputs
    security: Tests verifying input sanitization and XSS resilience
